<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    #sidebar {
      width: 280px;
      background: #1e1e2e;
      color: #cdd6f4;
      display: flex;
      flex-direction: column;
      padding: 16px;
      overflow-y: auto;
      flex-shrink: 0;
    }

    #sidebar h1 {
      font-size: 1.2rem;
      color: #cba6f7;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #313244;
    }

    .sidebar-section {
      margin-bottom: 20px;
    }

    .sidebar-section h2 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #6c7086;
      margin-bottom: 8px;
    }

    .sidebar-item {
      background: #313244;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 6px;
      font-size: 0.85rem;
    }

    .sidebar-item .item-title {
      color: #cdd6f4;
      font-weight: 500;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sidebar-item .item-meta {
      color: #6c7086;
      font-size: 0.75rem;
    }

    .badge {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 600;
      margin-left: 4px;
    }

    .badge-pending { background: #f38ba8; color: #1e1e2e; }
    .badge-paid { background: #a6e3a1; color: #1e1e2e; }
    .badge-open { background: #fab387; color: #1e1e2e; }
    .badge-done { background: #a6e3a1; color: #1e1e2e; }

    .empty-state {
      color: #45475a;
      font-size: 0.8rem;
      text-align: center;
      padding: 8px 0;
    }

    /* Main chat area */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #chat-header {
      background: #fff;
      padding: 16px 20px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #chat-header .avatar {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #cba6f7, #89b4fa);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }

    #chat-header .title { font-weight: 600; color: #111; }
    #chat-header .subtitle { font-size: 0.8rem; color: #6b7280; }

    #refresh-btn {
      margin-left: auto;
      background: #f3f4f6;
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 0.8rem;
      color: #374151;
    }

    #refresh-btn:hover { background: #e5e7eb; }

    /* Quick actions */
    #quick-actions {
      background: #fff;
      padding: 10px 20px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .quick-btn {
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 0.8rem;
      cursor: pointer;
      color: #374151;
      transition: all 0.15s;
    }

    .quick-btn:hover {
      background: #cba6f7;
      border-color: #cba6f7;
      color: #1e1e2e;
    }

    /* Messages */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      max-width: 75%;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .message.user { align-self: flex-end; align-items: flex-end; }
    .message.assistant { align-self: flex-start; align-items: flex-start; }

    .bubble {
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 0.9rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user .bubble {
      background: #cba6f7;
      color: #1e1e2e;
      border-bottom-right-radius: 4px;
    }

    .message.assistant .bubble {
      background: #fff;
      color: #111827;
      border: 1px solid #e5e7eb;
      border-bottom-left-radius: 4px;
    }

    .msg-time {
      font-size: 0.7rem;
      color: #9ca3af;
      padding: 0 4px;
    }

    .typing-indicator .bubble {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 14px 16px;
    }

    .dot {
      width: 8px; height: 8px;
      background: #9ca3af;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }

    /* Input area */
    #input-area {
      background: #fff;
      border-top: 1px solid #e5e7eb;
      padding: 16px 20px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    #user-input {
      flex: 1;
      border: 1px solid #e5e7eb;
      border-radius: 24px;
      padding: 10px 18px;
      font-size: 0.9rem;
      resize: none;
      outline: none;
      font-family: inherit;
      max-height: 120px;
      overflow-y: auto;
      transition: border-color 0.15s;
    }

    #user-input:focus { border-color: #cba6f7; }

    #send-btn {
      width: 40px; height: 40px;
      background: #cba6f7;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }

    #send-btn:hover { background: #b48ead; }
    #send-btn:disabled { background: #e5e7eb; cursor: not-allowed; }

    #send-btn svg { color: white; }

    .error-toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: #f38ba8;
      color: #1e1e2e;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.85rem;
      z-index: 100;
      animation: fadeInOut 4s forwards;
    }

    @keyframes fadeInOut {
      0% { opacity: 0; } 10% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; }
    }
  </style>
</head>
<body>

<!-- Sidebar -->
<aside id="sidebar">
  <h1>&#x1F916; AI Agent</h1>

  <div class="sidebar-section">
    <h2>Bills</h2>
    <div id="bills-list"><p class="empty-state">Loading...</p></div>
  </div>

  <div class="sidebar-section">
    <h2>Follow-ups</h2>
    <div id="followups-list"><p class="empty-state">Loading...</p></div>
  </div>
</aside>

<!-- Main chat -->
<main id="main">
  <div id="chat-header">
    <div class="avatar">&#x1F916;</div>
    <div>
      <div class="title">AI Agent</div>
      <div class="subtitle">Powered by Claude</div>
    </div>
    <button id="refresh-btn" onclick="loadSidebarData()">&#x21BB; Refresh</button>
  </div>

  <div id="quick-actions">
    <button class="quick-btn" onclick="sendQuick('Check my emails')">&#x1F4E7; Check emails</button>
    <button class="quick-btn" onclick="sendQuick('Show all pending bills')">&#x1F4B3; Pending bills</button>
    <button class="quick-btn" onclick="sendQuick('Show all open follow-ups')">&#x1F4CB; Follow-ups</button>
    <button class="quick-btn" onclick="sendQuick('What can you help me with?')">&#x2753; Help</button>
  </div>

  <div id="messages">
    <div class="message assistant">
      <div class="bubble">Hi! I'm your AI agent. I can help you manage emails, track bills, and handle follow-up tasks. What would you like to do?</div>
      <div class="msg-time">now</div>
    </div>
  </div>

  <div id="input-area">
    <textarea id="user-input" rows="1" placeholder="Type a message..." onkeydown="handleKey(event)"></textarea>
    <button id="send-btn" onclick="sendMessage()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
</main>

<script>
  let conversationHistory = [];

  function formatTime(date) {
    return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function appendMessage(role, text) {
    const container = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = `message ${role}`;
    div.innerHTML = `
      <div class="bubble">${escapeHtml(text)}</div>
      <div class="msg-time">${formatTime(new Date())}</div>
    `;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
    return div;
  }

  function showTyping() {
    const container = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'message assistant typing-indicator';
    div.id = 'typing';
    div.innerHTML = '<div class="bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  function escapeHtml(text) {
    return text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function showError(msg) {
    const toast = document.createElement('div');
    toast.className = 'error-toast';
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 4200);
  }

  async function sendMessage() {
    const input = document.getElementById('user-input');
    const message = input.value.trim();
    if (!message) return;

    input.value = '';
    input.style.height = 'auto';
    document.getElementById('send-btn').disabled = true;

    appendMessage('user', message);
    showTyping();

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, history: conversationHistory })
      });

      const data = await res.json();
      removeTyping();

      if (!res.ok) {
        showError(data.error || 'Something went wrong');
        appendMessage('assistant', 'Sorry, I encountered an error. Please try again.');
      } else {
        conversationHistory = data.history || [];
        appendMessage('assistant', data.response || '(no response)');
        // Refresh sidebar after agent actions
        loadSidebarData();
      }
    } catch (err) {
      removeTyping();
      showError('Network error: ' + err.message);
      appendMessage('assistant', 'Sorry, I could not reach the server.');
    }

    document.getElementById('send-btn').disabled = false;
    input.focus();
  }

  function sendQuick(text) {
    const input = document.getElementById('user-input');
    input.value = text;
    sendMessage();
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
    // Auto-resize textarea
    const ta = e.target;
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
  }

  async function loadSidebarData() {
    try {
      const [billsRes, followupsRes] = await Promise.all([
        fetch('/bills'),
        fetch('/followups')
      ]);
      const bills = await billsRes.json();
      const followups = await followupsRes.json();
      renderBills(bills);
      renderFollowups(followups);
    } catch (err) {
      console.error('Sidebar load error:', err);
    }
  }

  function renderBills(bills) {
    const el = document.getElementById('bills-list');
    if (!bills.length) {
      el.innerHTML = '<p class="empty-state">No bills yet</p>';
      return;
    }
    el.innerHTML = bills.slice(0, 6).map(b => `
      <div class="sidebar-item">
        <div class="item-title">${escapeHtml(b.name)}
          <span class="badge badge-${b.status}">${b.status}</span>
        </div>
        <div class="item-meta">$${Number(b.amount).toFixed(2)} &bull; due ${b.due_date}</div>
      </div>
    `).join('');
  }

  function renderFollowups(followups) {
    const el = document.getElementById('followups-list');
    if (!followups.length) {
      el.innerHTML = '<p class="empty-state">No follow-ups yet</p>';
      return;
    }
    el.innerHTML = followups.slice(0, 6).map(f => `
      <div class="sidebar-item">
        <div class="item-title">${escapeHtml(f.title)}
          <span class="badge badge-${f.status}">${f.status}</span>
        </div>
        <div class="item-meta">${f.priority} priority &bull; ${f.due_date}</div>
      </div>
    `).join('');
  }

  // Initial load
  loadSidebarData();
</script>
</body>
</html>
